<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Portal</title>
  <!-- Google Fonts for Luxury Modern & Royal Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@600;700;800&family=Orbitron:wght@700;800;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink-black: #0a0a0c;
      --gold-light: #fbe69b;
      --gold-mid: #dfa837;
      --gold-dark: #a67115;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #dcdde1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--ink-black);
    }

    /* Luxury White Silk & Gold Corner Frame Container */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 38%, #ffffff 30%, #f7f7f9 68%, #eceef2 100%);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 18px 46px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.22);
    }

    /* Soft Luminous Satin Sheen (No harsh lines) */
    .app-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(125deg, rgba(255,255,255,0.9) 0%, rgba(235,237,242,0.35) 35%, rgba(255,255,255,0.85) 55%, rgba(230,232,238,0.4) 80%, rgba(255,255,255,0.9) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative Background Silk Folds & Halftone Dots */
    .bg-decor-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      justify-content: space-between;
      gap: 12px;
    }

    /* Top Crown Divider */
    .crown-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 2px;
    }

    .crown-line {
      height: 1.5px;
      width: 68px;
      background: linear-gradient(90deg, transparent, #d69e2e);
    }

    .crown-line.right {
      background: linear-gradient(90deg, #d69e2e, transparent);
    }

    .crown-diamond {
      width: 6px;
      height: 6px;
      background: #d69e2e;
      transform: rotate(45deg);
    }

    /* Brand Logo & Modern Futuristic Typography */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      width: 100%;
    }

    .brand-logo-box {
      width: 215px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    .brand-logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: clamp(23px, 6.6vw, 28px);
      letter-spacing: 1.2px;
      line-height: 1.1;
      color: var(--ink-black);
      text-transform: uppercase;
    }

    .title-underline {
      width: 92%;
      max-width: 375px;
      height: 3px;
      background-color: var(--ink-black);
      margin: 6px 0 6px;
      border-radius: 2px;
    }

    .brand-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 9.8px;
      letter-spacing: 2.3px;
      color: #161618;
      text-transform: uppercase;
    }

    /* 4-Column Black & Gold Rounded-Square Icon Grid */
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 8px;
      width: 100%;
      max-width: 385px;
      margin: 14px 0 6px;
      justify-items: center;
      align-items: start;
    }

    .nav-card {
      position: relative;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 2px;
      transition: transform 0.18s ease;
    }

    /* Subtle Vertical Gold Divider between columns in first row */
    .nav-card:not(:nth-child(4n))::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 6px;
      height: 62px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(212, 155, 45, 0.65), transparent);
    }

    .nav-card:hover { transform: translateY(-3px); }
    .nav-card:active { transform: scale(0.94); }

    /* Gold-Bordered Glossy Black Squircle Icon Frame */
    .icon-box {
      width: 66px;
      height: 66px;
      border-radius: 17px;
      padding: 3px;
      background: linear-gradient(145deg, #fae293 0%, #c88e22 45%, #f5d36c 75%, #9a6812 100%);
      box-shadow: 0 7px 15px rgba(0, 0, 0, 0.24), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
    }

    .icon-inner {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: radial-gradient(circle at 30% 25%, #242428 0%, #070709 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .icon-inner img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .nav-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 11.8px;
      color: var(--ink-black);
      text-align: center;
      line-height: 1.22;
    }

    /* Thank You, Gold Swoosh, 5 Stars & Tagline Footer */
    .thankyou-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 14px;
    }

    .thankyou-text {
      font-family: 'Great Vibes', cursive;
      font-size: 68px;
      line-height: 0.98;
      color: var(--ink-black);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
      padding: 0 12px;
    }

    .gold-arc-swoosh {
      width: 265px;
      height: 18px;
      margin-top: -2px;
      margin-bottom: 4px;
    }

    .stars-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .side-rule {
      height: 1.5px;
      width: 54px;
      background-color: #222225;
      opacity: 0.85;
    }

    .stars-row {
      display: flex;
      gap: 5px;
      cursor: pointer;
    }

    .star-icon {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.22));
      transition: transform 0.2s ease;
    }

    .star-icon:hover { transform: scale(1.16); }

    .bottom-tagline-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      width: 100%;
    }

    .bottom-rule {
      height: 1.2px;
      width: 42px;
      background-color: #222225;
      opacity: 0.75;
    }

    .bottom-tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 3px;
      color: #161618;
      text-transform: uppercase;
    }

    .provided-by {
      font-size: 9.5px;
      font-weight: 600;
      color: #333336;
      opacity: 0.75;
      margin-top: 8px;
      letter-spacing: 0.4px;
    }
  </style>
</head>

    // Built-in Crisp Vector Icons Library

      instagram: `

      whatsapp: `

      location: `

      website: `
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f3ce6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>`
    };

    (function renderPortal() {
      // Set Brand Name, Subtitle & Bottom Tagline
      const titleEl = document.getElementById("brandTitleText");
      const subtitleEl = document.getElementById("brandSubtitleText");
      const bottomTaglineEl = document.getElementById("bottomTaglineText");
      if (titleEl && PORTAL_CONFIG.BRAND_NAME) titleEl.textContent = PORTAL_CONFIG.BRAND_NAME;
      if (subtitleEl && PORTAL_CONFIG.BRAND_SUBTITLE) {
        const subText = PORTAL_CONFIG.BRAND_SUBTITLE;
        if (subText.toUpperCase().endsWith(" EXPERIENCE")) {
          const firstPart = subText.slice(0, -" EXPERIENCE".length);
          subtitleEl.innerHTML = `${firstPart}<span style="display: block; margin-top: 6px;">EXPERIENCE</span>`;
        } else {
          subtitleEl.textContent = subText;
        }
      }
      if (bottomTaglineEl && PORTAL_CONFIG.BOTTOM_TAGLINE) bottomTaglineEl.textContent = PORTAL_CONFIG.BOTTOM_TAGLINE;

      // Set Custom Logo if provided
      if (PORTAL_CONFIG.LOGO_URL && PORTAL_CONFIG.LOGO_URL.trim() !== "") {
        document.getElementById("logoContainer").innerHTML = `<img src="${PORTAL_CONFIG.LOGO_URL}" alt="Brand Logo">`;
      }

      // Set Brand Header Link
      const headerLink = document.getElementById("brandHeaderLink");
      if (headerLink && PORTAL_CONFIG.LOGO_CLICK_LINK && PORTAL_CONFIG.LOGO_CLICK_LINK.trim() !== "") {
        headerLink.href = PORTAL_CONFIG.LOGO_CLICK_LINK;
        headerLink.target = "_blank";
        headerLink.rel = "noopener noreferrer";
      }

      // Set Footer Text
      const providedEl = document.getElementById("providedByText");
      if (providedEl) providedEl.textContent = PORTAL_CONFIG.PROVIDED_BY || "";

      // Sort & Render Action Buttons
      const grid = document.getElementById("actionButtonsGrid");
      const sortedButtons = [...PORTAL_CONFIG.BUTTONS].sort((a, b) => (a.position || 99) - (b.position || 99));
      let firstReviewBtn = null;

      sortedButtons.forEach((btn) => {
        const anchor = document.createElement("a");
        anchor.className = "nav-card";
        anchor.href = btn.link || "#";
        if (btn.link && !btn.link.startsWith("tel:") && !btn.link.startsWith("mailto:")) {
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
        }

        const iconBox = document.createElement("div");
        iconBox.className = "icon-box";

        const iconInner = document.createElement("div");
        iconInner.className = "icon-inner";

        if (btn.iconUrl && btn.iconUrl.trim() !== "") {
          iconInner.innerHTML = `<img src="${btn.iconUrl}" alt="${btn.label}">`;
        } else {
          iconInner.innerHTML = BUILTIN_ICONS[btn.iconType] || BUILTIN_ICONS.website;
        }

        iconBox.appendChild(iconInner);

        const labelSpan = document.createElement("span");
        labelSpan.className = "nav-label";
        labelSpan.innerHTML = (btn.label || "").replace(/\n/g, "<br>");

        anchor.appendChild(iconBox);
        anchor.appendChild(labelSpan);
        grid.appendChild(anchor);

        if (!firstReviewBtn && btn.iconType === "google") {
          firstReviewBtn = anchor;
        }
      });

      const starsRow = document.getElementById("starsRow");
      if (starsRow && firstReviewBtn) {
        starsRow.onclick = () => firstReviewBtn.click();
      }
    })();
  </script>

</body>
